<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Final - Contador Dinámico</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .tarjeta {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }
    h1 {
      font-size: 1.5rem;
      color: #334155;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .pantalla {
      font-size: 4.5rem;
      font-weight: bold;
      color: #0f172a;
      margin: 20px 0;
      transition: color 0.3s ease;
    }
    .panel-botones {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    #btn-incrementar {
      background-color: #16a34a;
      color: white;
    }
    #btn-incrementar:hover {
      background-color: #15803d;
    }
    #btn-restar {
      background-color: #dc2626;
      color: white;
    }
    #btn-restar:hover {
      background-color: #b91c1c;
    }
    #btn-restablecer {
      background-color: #64748b;
      color: white;
    }
    #btn-restablecer:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    <h1>Contador Dinámico</h1>
    
    <!-- Elemento donde app.js renderiza el valor actual -->
    <div id="valor" class="pantalla">0</div>

    <!-- Botones de interacción capturados mediante IDs por app.js -->
    <div class="panel-botones">
      <button id="btn-restar">- Restar</button>
      <button id="btn-restablecer">Reset</button>
      <button id="btn-incrementar">+ Sumar</button>
    </div>
  </div>

  <!-- Vinculación del script con la lógica del contador -->
  <script src="app.js"></script>
</body>
</html>
